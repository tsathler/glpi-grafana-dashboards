apiVersion: 1

datasources:
  - name: GLPI MySQL
    uid: glpi-mysql
    type: mysql
    access: proxy
    url: ${GLPI_DB_HOST}:${GLPI_DB_PORT}
    database: ${GLPI_DB_NAME}
    user: ${GLPI_DB_USER}
    isDefault: true
    editable: false
    jsonData:
      # GLPI date columns are TIMESTAMP; a UTC session returns them (and NOW()) in UTC,
      # matching the UTC values Grafana reads and uses in time filters.
      timezone: "+00:00"
      tlsAuth: false
      tlsSkipVerify: false
    secureJsonData:
      password: ${GLPI_DB_PASSWORD}
