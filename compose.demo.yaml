name: glpi-service-desk-demo

services:
  mariadb:
    image: mariadb:11.4
    env_file:
      - .env.demo
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: demo_reader
      MARIADB_USER_HOST: "%"
      MARIADB_ROOT_HOST: localhost
    volumes:
      - demo-mariadb-data:/var/lib/mysql
      - ./demo/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./demo/generated/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./demo/grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.2
    env_file:
      - .env.demo
    environment:
      GLPI_DB_HOST: mariadb
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: demo_reader
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - demo-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  demo-mariadb-data:
  demo-grafana-data:
